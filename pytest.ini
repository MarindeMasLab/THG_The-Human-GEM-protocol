[tool:pytest]
# Pytest configuration for THG model generation tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test paths
testpaths = test_algorithms/other_test

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    checkpoint: marks tests related to checkpoint functionality
    pickle: marks tests related to pickle serialization

# Coverage options (when using pytest-cov)
[coverage:run]
source = 
    generate_data-base
    functions
omit = 
    */other_test/*
    */__pycache__/*
    */test_*.py

[coverage:report]
# Fail if coverage is below this percentage
fail_under = 0
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
